sonar.organization=cse210-team-404-not-found
sonar.projectKey=CSE210-Team-404-Not-Found_portfolio

sonar.sources=client/src
sonar.tests=client/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx

# Vitest writes this in the analyze job.
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info
sonar.typescript.tsconfigPaths=client/tsconfig.app.json
# The entry point only mounts the app; nothing to test.
sonar.coverage.exclusions=client/src/main.tsx
